version = 1

# Files that cannot carry a comment header.
[[annotations]]
path = [
  "**/*.json",
  "**/*.png",
  "**/*.ico",
  "**/*.icns",
  "Cargo.lock",
  "pnpm-lock.yaml",
  ".gitignore",
  "LICENSE",
  ".github/**/*.md",
  "crates/tauminus-ssh/tests/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tauminus contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tauminus contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Contributor Covenant text keeps its own license.
[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Command specs converted from withfig/autocomplete, which is MIT; the
# commit is in specs/UPSTREAM.
[[annotations]]
path = ["apps/desktop/src/features/complete/specs/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2021 Hercules Labs Inc. (Fig)", "2026 Tauminus contributors"]
SPDX-License-Identifier = "MIT"
