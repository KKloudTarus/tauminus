[graph]
all-features = true

[advisories]
yanked = "deny"
# The first two are unmaintained, not vulnerable: proc macros that run only
# at compile time and arrive through dependencies we cannot drop yet. Review
# when the parent crates upgrade.
#
# RUSTSEC-2023-0071 (Marvin) has no fixed release. The client signs with an
# RSA key file only after the server accepted it, once per hop of a connect
# the user starts: at most nine signatures with ProxyJump. The attack needs a
# very large number of timed private-key operations on the same key. RSA
# host key checks are public-key operations, which it does not affect. Keys
# in ssh-agent are signed by the agent, not by this crate. Revisit before
# adding automatic reconnect or bulk connects, which raise the count.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa: one signature per user-initiated connect; see comment above" },
  { id = "RUSTSEC-2024-0436", reason = "paste: pulled in by specta 2.0.0-rc.25" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: pulled in by gtk-rs 0.18 via Tauri on Linux" },
  # Merged into zbus 6, not abandoned; secret-service still builds on zbus 5.
  # Revisit when the Secret Service keyring store moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; pulled in by the Secret Service keychain on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; pulled in by the Secret Service keychain on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; pulled in by the Secret Service keychain on Linux" },
]

[licenses]
# Licenses that can be combined into a GPL-3.0-or-later work, limited to the
# ones the dependency tree uses today. The original OpenSSL license is left
# out on purpose: it is incompatible with the GPL.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # clipboard-win and error-code, arboard's Windows backend.
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Layer boundaries. A crate listed here may be used only by the crates in its
# `wrappers` list, so a domain or application crate cannot pull in a driver.
deny = [
  { crate = "portable-pty", wrappers = ["tauminus-pty"], reason = "only the PTY adapter talks to the OS pseudo-terminal" },
  { crate = "russh", wrappers = ["tauminus-ssh"], reason = "only the SSH adapter speaks the SSH protocol" },
  { crate = "encoding_rs", wrappers = ["tauminus-charset"], reason = "one place converts character sets" },
  { crate = "serialport", wrappers = ["tauminus-serial"], reason = "only the serial adapter opens ports" },
  { crate = "arboard", wrappers = ["tauminus-desktop"], reason = "the OS clipboard belongs to the desktop shell" },
  { crate = "keyring-core", wrappers = ["tauminus-store", "zbus-secret-service-keyring-store", "apple-native-keyring-store", "windows-native-keyring-store"], reason = "only the store adapter talks to the OS keychain" },
  { crate = "tauri", wrappers = ["tauminus-desktop", "tauri-specta", "tauri-plugin-notification"], reason = "Tauri belongs to the desktop shell; add each tauri-plugin-* crate here by name" },
  { crate = "notify-rust", wrappers = ["tauri-plugin-notification"], reason = "OS notifications go through the plugin, called from the desktop shell's Rust only" },
  { crate = "specta", wrappers = ["tauminus-desktop", "tauri", "tauri-specta", "specta-typescript", "specta-serde", "specta-util"], reason = "IPC types live in the desktop shell" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
