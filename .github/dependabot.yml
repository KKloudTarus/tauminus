version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them; most malicious or
    # broken publishes are caught and yanked within days.
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        update-types: [minor, patch]
    # The specta release candidates are pinned with `=` on purpose; bump them
    # by hand together with tauri-specta.
    ignore:
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them; most malicious or
    # broken publishes are caught and yanked within days.
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]
    # The Node types follow the Node major the project runs (engines,
    # CI and the release use 24); bump that major by hand with them.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them; most malicious or
    # broken publishes are caught and yanked within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
