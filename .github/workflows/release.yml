# Builds the desktop app for Linux, macOS and Windows. A pushed `v*` tag
# makes a draft release with every bundle attached; a manual run only builds
# and keeps the bundles as workflow artifacts, to try a change before a tag.
# Builds are not signed yet; README.md says how to open them.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the Linux bundles on the oldest glibc we support.
          - name: linux
            os: ubuntu-22.04
            args: ""
          # One app for Apple silicon and Intel.
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
          - name: windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # creates the draft release and uploads the bundles to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 rpm

      # rustup reads rust-toolchain.toml and installs the pinned compiler.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      # No dependency cache: a release builds from a clean slate, so a
      # poisoned cache cannot reach a published bundle.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Empty on a manual run, which then only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tauminus __VERSION__
          releaseBody: |
            Unsigned builds. See "Installing an unsigned build" in the README
            before opening them on macOS or Windows.
          releaseDraft: true
          prerelease: true
          uploadWorkflowArtifacts: true
          retryAttempts: 1
