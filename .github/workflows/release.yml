# Builds the desktop app for Linux, macOS and Windows. A pushed `v*` tag
# makes a draft release with every bundle attached; a manual run only builds
# and keeps the bundles as workflow artifacts, to try a change before a tag.
# Update bundles are signed in a job of their own (ADR 0033).
# macOS bundles are signed with a Developer ID and notarized when the
# APPLE_* secrets exist, and built unsigned otherwise; README.md says how
# to open an unsigned build.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the Linux bundles on the oldest glibc we support.
          - name: linux
            os: ubuntu-22.04
            args: ""
          # One app for Apple silicon and Intel.
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
          - name: windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # creates the draft release and uploads the bundles to it
    env:
      # Whether to sign: tauri reads an APPLE_* variable that is set but
      # empty as one to use, so the signing step runs only with them all.
      SIGN_MACOS: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 rpm

      # rustup reads rust-toolchain.toml and installs the pinned compiler.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      # No dependency cache: a release builds from a clean slate, so a
      # poisoned cache cannot reach a published bundle.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Notarization reads the App Store Connect key from a file; the
      # runner is thrown away after the job.
      - name: Write the App Store Connect key
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Build, signed and notarized
        if: env.SIGN_MACOS == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Empty on a manual run, which then only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tauminus __VERSION__
          releaseBody: |
            Windows and Linux builds are unsigned, and so is the macOS one
            until the project signs it. See "Installing an unsigned build"
            in the README before opening an unsigned one.
          releaseDraft: true
          # The app looks for updates in the latest release, which skips
          # prereleases; publishing the draft is the maintainer's review.
          prerelease: false
          uploadWorkflowArtifacts: true
          retryAttempts: 1

      - name: Build, unsigned
        if: env.SIGN_MACOS != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Empty on a manual run, which then only builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tauminus __VERSION__
          releaseBody: |
            Windows and Linux builds are unsigned, and so is the macOS one
            until the project signs it. See "Installing an unsigned build"
            in the README before opening an unsigned one.
          releaseDraft: true
          # The app looks for updates in the latest release, which skips
          # prereleases; publishing the draft is the maintainer's review.
          prerelease: false
          uploadWorkflowArtifacts: true
          retryAttempts: 1

      # The bundles the app updates from, for the signing job: the files
      # the release holds, and for macOS the app as a gzipped tar.
      - name: Collect the update bundles
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          out="$RUNNER_TEMP/updates"
          mkdir -p "$out"
          case "$RUNNER_OS" in
            Linux)
              cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb \
                target/release/bundle/rpm/*.rpm "$out/" ;;
            Windows)
              cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe "$out/" ;;
            macOS)
              COPYFILE_DISABLE=1 tar -czf "$out/Tauminus_${version}_universal.app.tar.gz" \
                -C target/universal-apple-darwin/release/bundle/macos Tauminus.app ;;
          esac
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-${{ matrix.name }}
          path: ${{ runner.temp }}/updates
          if-no-files-found: error
          retention-days: 7

  # Signs the update bundles and writes latest.json (ADR 0033). The key
  # lives only in the `release` environment, which a `v*` tag alone may
  # use; this job installs no packages and builds only the signer before
  # the key is in reach. A manual run signs with a key made for the run,
  # to check the files, and attaches nothing.
  sign:
    name: Sign updates
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_type == 'tag' && 'release' || 'updates-dry-run' }}
    permissions:
      contents: write # attaches the signatures and latest.json to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the signer
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked -p xtask

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: updates-*
          merge-multiple: true
          path: ${{ runner.temp }}/updates

      # The release notes are the tag's message (`git tag -a`).
      - name: Read the release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.txt"

      - name: Sign
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target/debug/xtask updater-sign "$RUNNER_TEMP/updates" --version "${TAG#v}" \
            --base-url "https://github.com/$REPO/releases/download/$TAG" \
            --notes "$RUNNER_TEMP/notes.txt"

      - name: Sign with a key made for this run
        if: github.ref_type != 'tag'
        env:
          REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          target/debug/xtask updater-sign "$RUNNER_TEMP/updates" --version "$version" \
            --base-url "https://github.com/$REPO/releases/download/v$version" --dry-run
          cat "$RUNNER_TEMP/updates/latest.json"

      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/updates"
          gh release upload "$TAG" --repo "$REPO" --clobber \
            ./*.sig ./*.app.tar.gz latest.json
