[package]
name = "tauminus-desktop"
description = "Tauminus desktop app: Tauri shell and composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Tauri mobile builds load the app as a library; desktop uses the binary.
name = "tauminus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
open.workspace = true
serde.workspace = true
# Already in the tree through tauminus-ssh; hashes a file being edited.
sha2 = "0.11"
specta.workspace = true
specta-typescript.workspace = true
tauminus-ai.workspace = true
tauminus-app.workspace = true
tauminus-import.workspace = true
tauminus-domain.workspace = true
tauminus-pty.workspace = true
tauminus-ssh.workspace = true
tauminus-presence.workspace = true
tauminus-store.workspace = true
tauminus-serial.workspace = true
tauminus-telnet.workspace = true
tauminus-mosh.workspace = true
tauri = { workspace = true, features = ["specta"] }
tauri-specta.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tokio = { workspace = true, features = ["fs", "process", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# Already in the tree; the uid that owns a private edit folder, whether
# the instance that left an edit folder still runs, and the open flags of
# files sent to `rz` (through its `libc`).
nix = { version = "0.31", default-features = false, features = ["fs", "signal", "user"] }

# USB security keys sign for FIDO2 key files (ADR 0027). Windows reaches
# keys only through webauthn.dll; there, an agent signs.
[target.'cfg(not(windows))'.dependencies]
tauminus-fido.workspace = true

# Wayland sessions need the data-control protocol; X11 works without it.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The mock runtime, to call commands with the state the app really manages.
tauri = { workspace = true, features = ["specta", "test"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
