[package]
name = "tauminus-ssh"
description = "SSH adapter for Tauminus, built on russh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Versions match what russh already brings into the tree.
bytes = "1.11"
data-encoding = "2.11"
# zeroize: the HMAC state that fingerprints a rejected password is wiped.
hmac = { version = "0.13", features = ["zeroize"] }
rand = "0.10"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = { version = "3.0.1", default-features = false }
sha1 = "0.11"
sha2 = "0.11"
# A FIDO2 key's ECDSA signature comes as DER; SSH wants its two mpints.
# Already in the tree through russh.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
# Through tokio already; sets IPV6_V6ONLY so a forward's two loopback
# listeners never collide with each other.
socket2 = "0.6"
tauminus-app.workspace = true
tauminus-charset.workspace = true
tauminus-domain.workspace = true
# FIDO2 key files sign through a security key (ADR 0027).
tauminus-fido.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# killpg for `ssh -G` children that outlive their timeout. Same version as
# the PTY adapter.
nix = { version = "0.31", default-features = false, features = ["signal", "user"] }

[target.'cfg(windows)'.dependencies]
# Already in the tree through tokio and russh.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
# Stand-in security keys: they sign as a FIDO2 key would.
ed25519-dalek = "3"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "pkcs8"] }
signature = "3"
# The Mosh test bootstraps over a real sshd, which lives in these tests.
tauminus-mosh.workspace = true
tauminus-pty.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
