[package]
name = "tauminus-ssh"
description = "SSH adapter for Tauminus, built on russh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Versions match what russh already brings into the tree.
data-encoding = "2.11"
hmac = "0.13"
rand = "0.10"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
sha1 = "0.11"
sha2 = "0.11"
tauminus-app.workspace = true
tauminus-domain.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# killpg for `ssh -G` children that outlive their timeout. Same version as
# the PTY adapter.
nix = { version = "0.28", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# Already in the tree through tokio and russh.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
