[package]
name = "tauminus-store"
description = "Saved hosts for Tauminus, kept in a JSON file written atomically"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Same version the SSH adapter uses, so the tree holds one copy.
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
tauminus-app.workspace = true
tauminus-domain.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
