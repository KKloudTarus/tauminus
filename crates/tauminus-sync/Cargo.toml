[package]
name = "tauminus-sync"
description = "End-to-end encrypted sync of Tauminus's saved lists through a folder or git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The vault's primitives, already in the tree: Argon2id wraps the sync key
# under a passphrase, HKDF-SHA256 derives the object key, and
# XChaCha20-Poly1305 seals each object.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Deflate for objects, already in the tree through png.
flate2 = "1.1.10"
hkdf = "0.13.0"
# S3: SigV4 signs with HMAC-SHA256; responses list keys in XML. Both
# already in the tree, as is the HTTP client the AI assistant uses.
hmac = "0.13"
quick-xml = "0.42"
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
url = "2.5"
sha2 = { version = "0.11.1", default-features = false }
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
tauminus-app.workspace = true
tauminus-domain.workspace = true
tauminus-store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
zeroize.workspace = true

# O_NOFOLLOW and O_NONBLOCK, so a link or pipe a target plants is never
# followed; already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
