[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]
default-members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/KKloudTarus/tauminus"
publish = false

[workspace.dependencies]
# Internal crates
tauminus-ai = { path = "crates/tauminus-ai" }
tauminus-app = { path = "crates/tauminus-app" }
tauminus-charset = { path = "crates/tauminus-charset" }
tauminus-domain = { path = "crates/tauminus-domain" }
tauminus-presence = { path = "crates/tauminus-presence" }
tauminus-serial = { path = "crates/tauminus-serial" }
tauminus-pty = { path = "crates/tauminus-pty" }
tauminus-ssh = { path = "crates/tauminus-ssh" }
tauminus-store = { path = "crates/tauminus-store" }
tauminus-telnet = { path = "crates/tauminus-telnet" }
tauminus-mosh = { path = "crates/tauminus-mosh" }

# External crates. Each one is allowed only in the crates listed in deny.toml [bans].
anyhow = "1.0.104"
# The OS clipboard, text only; WebKitGTK refuses navigator.clipboard reads.
arboard = { version = "3.7.0", default-features = false }
portable-pty = "0.9.0"
# HTTPS for the AI assistant's server, in tauminus-ai only. No default
# features: no proxy from the environment, no charset guessing, and rustls
# on ring, which russh already brings, instead of aws-lc.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The OS's certificate store and checks, as reqwest's own rustls uses.
rustls-platform-verifier = "0.7.1"
# Finding a Zmodem offer in every output chunk: SIMD substring search,
# already in the tree through regex. MIT OR Unlicense.
memchr = { version = "=2.8.3", default-features = false, features = ["std"] }
# Zmodem, sans I/O, in the domain: the protocol of `sz`, for receiving
# files a host sends. MIT OR Apache-2.0; no_std, heapless.
zmodem2 = "=0.7.3"
# Highlight and trigger patterns: linear-time matching, so output a host
# sends cannot make a pattern backtrack.
regex = "1.13.1"
# Checks a pattern's syntax without compiling it, for reading a file of them.
regex-syntax = "0.8.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = "2.12.5"
tauri-build = "2.7.4"
# OS notifications for trigger matches, raised from Rust only: the webview
# gets none of the plugin's permissions.
tauri-plugin-notification = "2.7.0"
# The native file picker for files sent to `rz` (ADR 0026), opened from
# Rust only: the webview is granted none of its commands.
tauri-plugin-dialog = "2.8.3"
# Opens http and https links from the terminal in the default browser.
open = "5.4.4"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
